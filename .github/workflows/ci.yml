name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        include:
          - os: ubuntu-24.04
            tags: -tags webkit2_41
            race: -race
          - os: macos-latest
            tags: ""
            race: -race
          - os: windows-latest
            tags: ""
            race: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: go test
        run: go test ${{ matrix.tags }} ${{ matrix.race }} ./internal/...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  build:
    name: build (${{ matrix.os }})
    needs: [go, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        include:
          - os: ubuntu-24.04
            build_args: -tags webkit2_41
            artifact: DiskChart-linux-amd64
            package: cp build/bin/DiskChart dist/DiskChart-linux-amd64
          - os: ubuntu-24.04-arm
            build_args: -tags webkit2_41
            artifact: DiskChart-linux-arm64
            package: cp build/bin/DiskChart dist/DiskChart-linux-arm64
          - os: macos-latest
            build_args: -platform darwin/universal -o DiskChart
            artifact: DiskChart-darwin-universal
            package: ditto -c -k --keepParent build/bin/DiskChart.app dist/DiskChart-darwin-universal.zip
          - os: windows-latest
            build_args: -platform windows/amd64,windows/arm64
            artifact: DiskChart-windows
            package: cp build/bin/DiskChart-amd64.exe dist/DiskChart-windows-amd64.exe && cp build/bin/DiskChart-arm64.exe dist/DiskChart-windows-arm64.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Stamp version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="$GITHUB_REF_NAME"
            product="${version#v}"
            product="${product%%[-+]*}"
            jq --arg v "$product" '.info.productVersion = $v' wails.json > wails.json.tmp
            mv wails.json.tmp wails.json
          else
            version=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: wails build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: wails build ${{ matrix.build_args }} -ldflags "-X main.version=$VERSION"

      - name: Package
        run: mkdir -p dist && ${{ matrix.package }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: DiskChart-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum DiskChart-* > SHA256SUMS

      - name: Publish release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          args=(--draft --verify-tag --generate-notes)
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${args[@]}"
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false
